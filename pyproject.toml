[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["run", "build", "RawData/fast_lio", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# 独立脚本先将项目根目录加入 sys.path，再导入项目模块。
[tool.ruff.lint.per-file-ignores]
"Pipeline/*.py" = ["E402"]
"Register/*.py" = ["E402"]
"FormatChange/*.py" = ["E402"]
"RawData/prepare.py" = ["E402"]
"Tools/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"Common/CheckPointCloudPipeline.py" = ["E402"]
